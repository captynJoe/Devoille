<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F5KB7YM85L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-F5KB7YM85L');
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout - Dévoilé Essentials</title>
    <meta name="description" content="Secure Dévoilé Essentials checkout. Pay with card or M-Pesa, choose discreet delivery or Nairobi CBD pickup." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('devoile-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
        } catch (error) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=20260921-checkout-contrast" />
    <script src="/theme.js?v=20260727-overlay3" defer></script>
    <script src="/product-data.js?v=20260727-overlay3" defer></script>
    <script src="/menu.js?v=20260801-clean-login" defer></script>
    <script src="/search.js?v=20260727-overlay3" defer></script>
    <script src="/auth.js?v=20260801-clean-login" defer></script>
    <script src="/footer.js?v=20260801-admin-real" defer></script>
    <script src="/checkout.js?v=20260818-pesapal-errors" defer></script>
  </head>
  <body>
    <header class="site-header checkout-header">
      <button class="icon-button search-button" type="button" data-search-open aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.2 16.2 4.3 4.3"/></svg>
      </button>
      <a class="brand" href="/" aria-label="Dévoilé Essentials home"><span>Dévoilé Essentials</span></a>
      <nav aria-label="Primary navigation">
        <a href="/">Home</a>
        <a href="/shop">Shop</a>
        <a href="/scent-room">Scent Room</a>
        <a href="/care-journal">Care Journal</a>
      </nav>
      <div class="header-actions">
        <button class="icon-button menu-button" type="button" data-menu-toggle aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></button>
        <a class="icon-button" href="/shop" aria-label="Back to shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></a>
      </div>
    </header>

    <main class="page-main checkout-page-main">
      <section class="checkout-topbar">
        <a class="checkout-back" href="/shop" aria-label="Back to shop">&larr; Shop</a>
        <h1 id="checkout-heading">Checkout</h1>
      </section>

      <section class="checkout-page" aria-label="Checkout">
        <div class="checkout-panel checkout-summary-panel">
          <div class="checkout-section-head">
            <h2>Order summary</h2>
          </div>
          <div class="checkout-lines" data-checkout-lines></div>
          <div class="checkout-total-row"><span>Subtotal</span><strong data-checkout-total>KSh 0</strong></div>
          <p class="checkout-note">Delivery details are confirmed after payment.</p>
        </div>

        <form class="checkout-panel checkout-form-panel" data-checkout-page-form>
          <div class="checkout-section-head">
            <h2>Contact &amp; delivery</h2>
          </div>
          <div class="checkout-form-grid">
            <label>Full name<input name="name" type="text" autocomplete="name" required placeholder="Your name" /></label>
            <label>Phone<input name="phone" type="tel" autocomplete="tel" placeholder="07..." /></label>
            <label>Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" /></label>
            <label>Fulfillment<select name="fulfillment"><option>Discreet delivery</option><option>Nairobi CBD pickup</option></select></label>
          </div>
          <fieldset class="payment-methods">
            <legend>Payment</legend>
            <label class="payment-option"><input type="radio" name="payment_method" value="pesapal" checked /><span><strong>Pay with Card or M-Pesa</strong><small>Secure, encrypted checkout.</small></span></label>
          </fieldset>
          <p data-checkout-page-error class="checkout-error" hidden></p>
          <button type="submit" data-checkout-page-submit>Continue to payment</button>
          <a class="checkout-return" href="/shop">Continue shopping</a>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-meta"><span>© 2026, Dévoilé Essentials</span><span>Discreet Nairobi fulfilment</span><span>Secure payment</span></div>
    </footer>
  </body>
</html>
