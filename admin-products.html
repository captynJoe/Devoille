<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];

      gtag('js', new Date());
      gtag('config', 'G-F5KB7YM85L');

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products Admin - Dévoilé Essentials</title>
    <meta name="description" content="Dévoilé Essentials admin dashboard." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('devoile-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
        } catch (error) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=20260801-admin-real" />
    <script src="/theme.js?v=20260727-overlay3" defer></script>
    <script src="/product-data.js?v=20260727-overlay3" defer></script>
    <script src="/admin-data.js?v=20260801-clean-login" defer></script>
    <script src="/basket.js?v=20260727-overlay3" defer></script>
    <script src="/menu.js?v=20260801-clean-login" defer></script>
    <script src="/search.js?v=20260727-overlay3" defer></script>
    <script src="/auth.js?v=20260801-clean-login" defer></script>
    <script src="/admin.js?v=20260801-admin-real" defer></script>
  </head>
  <body data-auth-required="user" class="admin-shell-page">
    <aside class="admin-sidebar" aria-label="Admin navigation">
      <a class="admin-sidebar-brand" href="/admin"><span>Dévoilé</span><strong>Admin</strong></a>
      <nav class="admin-side-nav" aria-label="Admin sections">
        <a href="/admin">Dashboard</a>
        <a href="/admin/orders">Orders</a>
        <a class="active" href="/admin/products">Products</a>
        <a href="/admin/subscribers">Subscribers</a>
        <a href="/admin/actions">Activity</a>
        <a href="/admin/settings">Settings</a>
      </nav>
      <div class="admin-sidebar-foot"><a href="/">Storefront</a></div>
    </aside>
    <header class="site-header admin-header admin-topbar">
      <a class="brand" href="/admin" aria-label="Dévoilé admin home"><span>Dévoilé Admin</span></a>
      <div class="header-actions">
        <button class="icon-button menu-button" type="button" data-menu-toggle aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></button>
        <a class="icon-button" href="/" aria-label="Back to storefront"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></a>
      </div>
    </header>

    <main class="page-main admin-main admin-workspace">
      <section class="admin-page-title"><p class="eyebrow">Catalog</p><h1>Products</h1></section>
      <section id="products" class="admin-section">
        <div class="admin-section-head"><div><p class="eyebrow">Editor</p><h2>Product details</h2></div><div class="admin-head-actions"><button type="button" data-admin-add-product>Add product</button><button type="button" data-admin-reset-products>Reset catalog</button></div></div>
        <form class="admin-product-form" data-product-form>
          <input type="hidden" name="id" />
          <label>Product name<input name="name" type="text" required placeholder="Product name" /></label>
          <label>Category<select name="category"><option>Aroma</option><option>Lubricants</option><option>Ambiance</option><option>Accessories</option></select></label>
          <label>Price<input name="price" type="number" min="0" required placeholder="599" /></label>
          <label>Compare at<input name="compareAt" type="number" min="0" placeholder="899" /></label>
          <label>Status<select name="status"><option value="in_stock">In stock</option><option value="sale">Sale</option><option value="sold_out">Sold out</option></select></label>
          <label>Stock<input name="stock" type="number" min="0" required placeholder="12" /></label>
          <label>Visual fallback<select name="visual"><option value="dropper">Dropper</option><option value="mini-dropper">Mini dropper</option><option value="tall">Classic bottle</option><option value="jumbo">Jumbo bottle</option><option value="small mint">Mint bottle</option><option value="small rose">Rose bottle</option><option value="candle">Candle</option></select></label>
          <label>Tone<select name="tone"><option value="">Standard</option><option value="featured">Featured</option><option value="scent">Scent</option><option value="sold">Sold</option><option value="sold scent">Sold scent</option></select></label>
          <label class="form-wide">Cover image<input name="imageUpload" type="file" accept="image/*" /><span class="field-hint">Shown on shop cards using the crop you choose. Keep the product centered with a little breathing room.</span></label>
          <div class="upload-preview" data-upload-preview><span>No image uploaded</span></div>
          <label class="form-wide">Short description<textarea name="short" rows="2" placeholder="Short product note shown on product cards"></textarea></label>
          <label class="form-wide">Full description<textarea name="description" rows="6" placeholder="Full product description shown on the product page. Leave a blank line between paragraphs."></textarea></label>
          <label class="form-wide">Additional photos<input name="galleryUpload" type="file" accept="image/*" multiple /><span class="field-hint">Shown in the product page gallery — up to 8 photos, any shape.</span></label>
          <div class="gallery-preview" data-gallery-preview><span class="gallery-preview-empty">No additional photos yet</span></div>
          <div class="form-actions"><button type="submit">Save product</button><button type="button" data-admin-cancel-edit>Cancel</button><button type="button" data-admin-delete-product hidden>Delete product</button></div>
        </form>
        <div class="inventory-grid" data-admin-products></div>
      </section>
    </main>
  </body>
</html>
