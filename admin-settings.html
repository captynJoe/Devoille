    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings - Dévoilé Essentials</title>
    <meta name="description" content="Configure Dévoilé Essentials storefront footer and social links." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('devoile-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
        } catch (error) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=20260921-checkout-contrast" />
    <script src="/theme.js?v=20260727-overlay3" defer></script>
    <script src="/product-data.js?v=20260727-overlay3" defer></script>
    <script src="/admin-data.js?v=20260801-clean-login" defer></script>
    <script src="/basket.js?v=20260727-overlay3" defer></script>
    <script src="/menu.js?v=20260801-clean-login" defer></script>
    <script src="/search.js?v=20260727-overlay3" defer></script>
    <script src="/auth.js?v=20260801-clean-login" defer></script>
    <script src="/admin-settings.js?v=20260801-admin-real" defer></script>
  </head>
  <body data-auth-required="user" class="admin-shell-page">
    <aside class="admin-sidebar" aria-label="Admin navigation">
      <a class="admin-sidebar-brand" href="/admin"><span>Dévoilé</span><strong>Admin</strong></a>
      <nav class="admin-side-nav" aria-label="Admin sections">
        <a href="/admin">Dashboard</a>
        <a href="/admin/orders">Orders</a>
        <a href="/admin/products">Products</a>
        <a href="/admin/subscribers">Subscribers</a>
        <a href="/admin/actions">Activity</a>
        <a class="active" href="/admin/settings">Settings</a>
      </nav>
      <div class="admin-sidebar-foot"><a href="/">Storefront</a></div>
    </aside>
    <header class="site-header admin-header admin-topbar">
      <a class="brand" href="/admin" aria-label="Dévoilé admin home"><span>Dévoilé Admin</span></a>
      <div class="header-actions">
        <button class="icon-button menu-button" type="button" data-menu-toggle aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></button>
        <a class="icon-button" href="/" aria-label="Back to storefront"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></a>
      </div>
    </header>

    <main class="page-main admin-main admin-workspace">
      <section class="admin-page-title"><p class="eyebrow">Settings</p><h1>Storefront</h1></section>
      <section class="admin-section settings-section">
        <div class="admin-section-head"><div><p class="eyebrow">Footer</p><h2>Links and copy</h2></div><a class="admin-inline-link" href="/">Preview</a></div>
        <form class="admin-product-form settings-form" data-settings-form>
          <label>Facebook URL<input name="facebook_url" type="url" placeholder="https://www.facebook.com/devoilessentials" /></label>
          <label>Instagram URL<input name="instagram_url" type="url" placeholder="https://www.instagram.com/devoilessentials" /></label>
          <label>TikTok URL<input name="tiktok_url" type="url" placeholder="https://www.tiktok.com/@devoilessentials" /></label>
          <label>Contact email<input name="contact_email" type="email" placeholder="Devoilessentials@gmail.com" /></label>
          <label>Privacy URL<input name="privacy_url" type="text" placeholder="/privacy" /></label>
          <label class="form-wide">Footer blurb<textarea name="footer_blurb" rows="4" placeholder="Private scent, comfort, and care essentials..."></textarea></label>
          <div class="form-actions form-wide"><button type="submit">Save settings</button><span class="settings-status" data-settings-status></span></div>
        </form>
      </section>
    </main>
  </body>
</html>
